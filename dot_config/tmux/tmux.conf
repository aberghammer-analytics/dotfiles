# ~/.tmux.conf — Mac + Pi 5, managed by chezmoi
# Prefix stays Ctrl+b (matches Herdr, keeps muscle memory portable)

# ── Core behavior ────────────────────────────────────────────────
set -s escape-time 10                 # kill the Esc delay (Neovim/LazyVim fix)
set -g mouse on                       # scroll, click panes, drag to resize
set -g history-limit 50000
set -g base-index 1                   # windows start at 1
setw -g pane-base-index 1             # panes too
set -g renumber-windows on            # close window 2 of 4 → no gaps
set -g focus-events on                # lets Neovim autoread/refresh properly
setw -g mode-keys vi                  # vi keys in copy mode

# ── Truecolor (WezTerm → tmux passthrough) ───────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,wezterm:RGB"

# ── Quality-of-life keybinds ─────────────────────────────────────
# Splits that make spatial sense, opening in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also inherit current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable: hold prefix, tap repeatedly)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode: prefix+[ to enter, v to select, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Quick config reload
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ── Status line ──────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"          # tokyonight-ish
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]│ "
set -g status-left-length 30
set -g status-right "#[fg=#9ece6a]#H #[fg=#565f89]│ #[fg=#a9b1d6]%a %b %d %H:%M "
setw -g window-status-current-style "fg=#7aa2f7,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# ── Plugins (tpm) ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'        # system clipboard, mac + linux
set -g @plugin 'tmux-plugins/tmux-resurrect'   # manual save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + restore on boot

# Resurrect/continuum settings — the Pi persistence story
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'      # restore nvim sessions too
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
